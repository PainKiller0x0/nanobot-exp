<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nanobot 记忆</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1713;--card:#15231d;--line:#2b4137;--text:#e7efe9;--muted:#9eb0a6;--accent:#65d895;--warn:#f2bf5b;--bad:#fb817b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173128,#0c1713 48%);color:var(--text);font:15px ui-monospace,SFMono-Regular,Consolas,monospace}.wrap{max-width:1160px;margin:auto;padding:28px 18px 48px}.hero,.card{background:rgba(21,35,29,.93);border:1px solid var(--line);border-radius:18px}.hero{padding:24px;margin-bottom:16px}h1{margin:0;font-size:28px}h1 span{color:var(--accent)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.metric{padding:14px;background:#101d18;border:1px solid var(--line);border-radius:12px}.metric b{font-size:25px;color:var(--accent)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:18px;min-width:0}h2{font-size:18px;margin:0 0 12px}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.meta{font-size:12px;color:var(--muted);margin-top:7px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;margin-right:5px;color:var(--accent);font-size:12px}button,input,select,textarea{font:inherit;border-radius:9px;border:1px solid var(--line);background:#0d1914;color:var(--text);padding:8px}button{cursor:pointer;color:#08150d;background:var(--accent);border:0;font-weight:700}button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}button.warn{background:var(--warn)}button.bad{background:var(--bad)}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:180px}.empty{color:var(--muted);padding:10px 0}.wide{grid-column:1/-1}@media(max-width:760px){.grid,.columns{grid-template-columns:1fr 1fr}.wide{grid-column:auto}}
  </style>
</head>
<body><main class="wrap">
  <section class="hero"><h1>Nanobot <span>记忆中枢</span></h1><p>只注入已确认的个人事实；候选记忆必须由你审核。网页与文章是参考资料，不会变成你的偏好或系统指令。</p><div class="grid" id="stats"></div></section>
  <section class="columns">
    <article class="card"><h2>待审核候选</h2><div id="candidates"></div></article>
    <article class="card"><h2>已确认记忆</h2><div class="row"><input id="search" placeholder="搜索：例如 广州、模型、偏好"><button onclick="loadConfirmed()">搜索</button></div><div id="confirmed"></div></article>
    <article class="card wide"><h2>手动记忆</h2><div class="row"><input id="manual" placeholder="例如：我习惯中文回复，涉及费用时先说明预算"><select id="kind"><option value="preference">偏好</option><option value="decision">决定</option><option value="note">备注</option></select><button onclick="saveManual()">记住</button></div></article>
    <article class="card"><h2>知识收件箱索引</h2><div id="knowledge"></div></article>
    <article class="card"><h2>最近注入</h2><div id="injections"></div></article>
  </section>
</main><script>
const api='/api'; const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(path,opt){const r=await fetch(api+path,opt);const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function item(v,buttons=''){return `<div class="item"><div>${esc(v.content||v.title||v.query)}</div><div class="meta"><span class="tag">${esc(v.kind||v.source||'记录')}</span><span class="tag">${esc(v.status||v.created_at||'')}</span> ${esc(v.source||'')} ${buttons}</div></div>`}
async function loadStats(){const s=await json('/stats');const data=[['确认',s.confirmed],['候选',s.candidates],['对话',s.episodes],['文章索引',s.knowledge],['旧记忆',s.imported_legacy]];document.querySelector('#stats').innerHTML=data.map(([k,v])=>`<div class="metric"><b>${v}</b><div>${k}</div></div>`).join('')}
async function loadCandidates(){const rows=await json('/memories?status=candidate&limit=40');document.querySelector('#candidates').innerHTML=rows.length?rows.map(v=>item(v,`<button onclick="action(${v.id},'accept')">确认</button> <button class="ghost" onclick="action(${v.id},'ignore')">忽略</button>`)).join(''):'<div class="empty">暂无候选，系统不会静默修改你的长期记忆。</div>'}
async function loadConfirmed(){const q=encodeURIComponent(document.querySelector('#search').value);const rows=await json('/memories?status=confirmed&limit=40&q='+q);document.querySelector('#confirmed').innerHTML=rows.length?rows.map(v=>item(v,`<button class="ghost" onclick="togglePin(${v.id},${!v.pinned})">${v.pinned?'取消固定':'固定'}</button> <button class="bad" onclick="remove(${v.id})">忘掉</button>`)).join(''):'<div class="empty">没有匹配的记忆。</div>'}
async function loadKnowledge(){const rows=await json('/knowledge?limit=8');document.querySelector('#knowledge').innerHTML=rows.length?rows.map(v=>item(v)).join(''):'<div class="empty">知识收件箱尚未同步。</div>'}
async function loadInjections(){const rows=await json('/injections');document.querySelector('#injections').innerHTML=rows.length?rows.slice(0,8).map(v=>`<div class="item">${esc(v.query)}<div class="meta">${esc(v.created_at)} · ${v.elapsed_ms}ms · ${esc(v.memory_ids||'未召回')}</div></div>`).join(''):'<div class="empty">尚无注入记录。</div>'}
async function action(id,name){await json(`/memories/${id}/${name}`,{method:'POST'});refresh()};async function togglePin(id,pinned){await json(`/memories/${id}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({pinned})});refresh()};async function remove(id){if(confirm('忘掉这条记忆？')){await json(`/memories/${id}`,{method:'DELETE'});refresh()}};async function saveManual(){const content=document.querySelector('#manual').value.trim();if(!content)return;await json('/memories',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content,kind:document.querySelector('#kind').value,status:'confirmed',source:'dashboard-manual',pinned:true)});document.querySelector('#manual').value='';refresh()};async function refresh(){try{await Promise.all([loadStats(),loadCandidates(),loadConfirmed(),loadKnowledge(),loadInjections()])}catch(e){console.error(e)}}refresh();
</script></body></html>
